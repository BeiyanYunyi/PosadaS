name: Container
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Initialization lifecycle tests
        run: node --test test/*.test.mjs
      - uses: docker/setup-buildx-action@v4
      - name: Build without database or application secrets
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: posadas:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test init and start using a disposable database
        run: bash test/container-smoke.sh
      - name: Save the tested image (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save posadas:test -o /tmp/posadas-image.tar
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: /tmp/posadas-image.tar
          retention-days: 1
          compression-level: 0
  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase registry name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v8
        with:
          name: tested-image
          path: /tmp
      - name: Publish exactly the tested image
        run: |
          docker load -i /tmp/posadas-image.tar
          docker tag posadas:test "$IMAGE:sha-$GITHUB_SHA"
          docker tag posadas:test "$IMAGE:main"
          docker push "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:main"
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          echo "Published: $DIGEST" >> "$GITHUB_STEP_SUMMARY"
